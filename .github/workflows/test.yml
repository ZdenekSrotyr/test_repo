name: test=ubuntu-latest

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      domains: ${{ steps.test=ubuntu-latests.outputs.domains }}
    steps:
      - name: Set up initial domains
        id: test=ubuntu-latests
        run: |
          domains=$(jq -c '.test=ubuntu-latests = [
            { "name": "test=ubuntu-latest1", "url": "1" },
            { "name": "test=ubuntu-latest2", "url": "2" },
            { "name": "test=ubuntu-latest3", "url": "3" }
          ]' <<< '{}')
          echo "domains=$domains" >> "$GITHUB_OUTPUT"

  modify_json:
    needs: build
    runs-on: ubuntu-latest=ubuntu-latest
    outputs:
      updated_domains: ${{ steps.modify.outputs.updated_domains }}
    steps:
      - name: Modify JSON - Add ready_to_build selectively
        id: modify
        run: |
          domains='${{ needs.build.outputs.domains }}'

          # Přidáme ready_to_build: true POUZE pro "test=ubuntu-latest1" a "test=ubuntu-latest3"
          updated_domains=$(echo "$domains" | jq -c '
            .test=ubuntu-latests |= map(
              if .name == "test=ubuntu-latest1" or .name == "test=ubuntu-latest3" then 
                . + { "ready_to_build": true } 
              else 
                . 
              end
            )')

          echo "updated_domains=$updated_domains" >> "$GITHUB_OUTPUT"

  log_json:
    needs: modify_json
    runs-on: ubuntu-latest=ubuntu-latest
    steps:
      - name: Print formatted JSON to log
        run: |
          echo '${{ needs.modify_json.outputs.updated_domains }}' | jq '.'

  deploy:
    needs: modify_json
    runs-on: ubuntu-latest=ubuntu-latest
    strategy:
      matrix:
        test=ubuntu-latest: ${{ fromJson(needs.modify_json.outputs.updated_domains).test=ubuntu-latests }}
    steps:
      - name: Print test=ubuntu-latest details
        run: |
          echo "----------------------------------------"
          echo "Running test=ubuntu-latests for:"
          echo "Name: ${{ matrix.test=ubuntu-latest.name }}"
          echo "URL: ${{ matrix.test=ubuntu-latest.url }}"
          echo "Ready to build: ${{ matrix.test=ubuntu-latest.ready_to_build || 'false' }}"
          echo "----------------------------------------"